<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - META MINDS PVT LTD</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../assets/images/meta_minds_logo.png">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container sidebar-logo">
                    <img class="company-logo" src="../assets/images/meta_minds_logo.png" alt="META MINDS PVT LTD">
                </div>
            </div>
            
            <ul class="sidebar-nav">
                <li>
                    <a href="dashboard.html">
                        <i data-lucide="layout-dashboard"></i>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="projects.html">
                        <i data-lucide="briefcase"></i>
                        Projects
                    </a>
                </li>
                <li>
                    <a href="revenue.html">
                        <i data-lucide="dollar-sign"></i>
                        Revenue
                    </a>
                </li>
                <li>
                    <a href="leaves.html">
                        <i data-lucide="calendar"></i>
                        Leave Requests
                    </a>
                </li>
                <li>
                    <a href="requests.html">
                        <i data-lucide="user-plus"></i>
                        Registration Requests
                    </a>
                </li>
                <li>
                    <a href="employees.html">
                        <i data-lucide="users"></i>
                        Employees
                    </a>
                </li>
                <li>
                    <a href="attendance.html" class="active">
                        <i data-lucide="clock"></i>
                        Attendance
                    </a>
                </li>
                <li>
                    <a href="notifications.html">
                        <i data-lucide="bell"></i>
                        Notifications
                        <span class="notification-badge" id="notifBadge">0</span>
                    </a>
                </li>
                <li>
                    <a href="#" onclick="logout()">
                        <i data-lucide="log-out"></i>
                        Logout
                    </a>
                </li>
            </ul>
        </aside>
        
        <main class="main-content">
            <div class="top-bar">
                <h1>Attendance Records</h1>
                <div class="user-info">
                    <div class="notification-icon" onclick="window.location.href='notifications.html'">
                        <i data-lucide="bell"></i>
                        <span class="notification-dot" id="notifDot"></span>
                    </div>
                    <div class="user-avatar">A</div>
                    <span>Admin</span>
                </div>
            </div>
            
            <div id="alertContainer"></div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Attendance Records</h2>
                    <label for="attendanceFromDate">From Date</label>
                    <input type="date" class="form-control" id="attendanceFromDate" onchange="loadAttendance()">
                    <label for="attendanceToDate">To Date</label>
                    <input type="date" class="form-control" id="attendanceToDate" onchange="loadAttendance()">
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Department</th>
                                <th>Designation</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                                <th>Total Hours</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <tr>
                                <td colspan="7" style="text-align: center;">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../assets/js/attendance.js"></script>
</body>
</html>
